name: One-time filter badge fix

on:
  push:
    branches:
      - agent/fix-filter-badge

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-filter-badge
      - name: Hide empty filter badge
        shell: bash
        run: |
          if ! grep -q '^\.count-badge\[hidden\]' site/styles.css; then
            printf '\n.count-badge[hidden] { display: none !important; }\n' >> site/styles.css
          fi
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles.css
          git commit -m "Hide inactive filter count badge"
          git push origin HEAD:agent/fix-filter-badge
