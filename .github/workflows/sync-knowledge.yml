name: Synchronize Pokémon GO knowledge

on:
  push:
    paths:
      - "knowledge/source-lock.json"
      - "scripts/sync_knowledge.py"
      - ".github/workflows/sync-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Regenerate pinned knowledge snapshot
        run: python scripts/sync_knowledge.py

      - name: Record generated knowledge diff
        shell: bash
        run: |
          git diff --check
          git status --short knowledge/

      - name: Commit synchronized snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- knowledge/ && git diff --cached --quiet -- knowledge/; then
            echo "Pinned knowledge snapshot is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/pokemon-go.json knowledge/pokemon-go.schema.json knowledge/species-index.json knowledge/species-index.schema.json
          git commit -m "Synchronize pinned Pokémon GO knowledge snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
