name: Refresh reviewed tablet baseline

on:
  push:
    branches:
      - fix/current-mobile-visual-baselines

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install baseline dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build current collection site
        run: python scripts/build_dashboard.py
      - name: Generate reviewed tablet candidate
        shell: bash
        run: |
          rm tests/visual-baselines/collection-tablet.png.b64
          npx playwright test tests/browser/visual-regression.spec.js --project=desktop-chromium || true
          test -s test-results/visual-baseline-candidates/collection-tablet.png.b64
          cp test-results/visual-baseline-candidates/collection-tablet.png.b64 tests/visual-baselines/collection-tablet.png.b64
      - name: Commit baseline and remove one-run workflow
        shell: bash
        run: |
          rm .github/workflows/refresh-tablet-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual-baselines/collection-tablet.png.b64 .github/workflows/refresh-tablet-baseline.yml
          git diff --cached --check
          git commit -m "Update tablet visual baseline"
          git push
