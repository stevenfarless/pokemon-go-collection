name: Generate npm lockfile

on:
  push:
    branches:
      - agent/five-easy-usability-fixes
    paths:
      - package.json
      - .github/workflows/generate-package-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/five-easy-usability-fixes

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generate package lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit package lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "Add reproducible npm package lockfile"
            git push origin HEAD:agent/five-easy-usability-fixes
          fi
