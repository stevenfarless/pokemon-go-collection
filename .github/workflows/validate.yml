name: Validate collection site

on:
  pull_request:
    paths:
      - "exports/shared-text-*.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run dashboard JavaScript tests
        run: |
          node --check site/app.js
          node --check site/hardening.js
          node tests/test_multisort.js
          node tests/test_hardening.js

      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find exports -type f -name 'shared-text-*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived export is committed under exports/; generator behavior is covered by tests."
          fi

      - name: Build site
        if: steps.exports.outputs.available == 'true'
        run: python scripts/build_collection.py

      - name: Verify generated resources
        if: steps.exports.outputs.available == 'true'
        run: |
          test -s dist/index.html
          test -s dist/data/pokemon.json
          test -s dist/data/build-manifest.json
          test -s dist/data/latest-export.csv
          test -s dist/llms.txt
          test -s dist/assets/hardening.js
          test -s dist/assets/stability.css
          grep -q 'assets/hardening.js' dist/index.html
          grep -q 'assets/stability.css' dist/index.html
