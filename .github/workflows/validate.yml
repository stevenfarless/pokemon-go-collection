name: Validate collection site

on:
  pull_request:
    paths:
      - "**/shared-text-*.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build site
        run: python scripts/build_site.py

      - name: Verify generated resources
        run: |
          test -s dist/index.html
          test -s dist/data/pokemon.json
          test -s dist/data/build-manifest.json
          test -s dist/data/latest-export.csv
          test -s dist/llms.txt
