name: Validate collection site

on:
  pull_request:
    paths:
      - "exports/shared-text-*.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run dashboard JavaScript tests
        run: |
          node --check site/app.js
          node --check site/hardening.js
          node --check site/accessibility.js
          node tests/test_multisort.js
          node tests/test_hardening.js
          node tests/test_accessible_sort.js

      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find exports -type f -name 'shared-text-*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived export is committed under exports/; generator behavior is covered by tests."
          fi

      - name: Build site
        if: steps.exports.outputs.available == 'true'
        run: python scripts/build_release.py

      - name: Validate generated JSON contracts
        if: steps.exports.outputs.available == 'true'
        run: python scripts/validate_generated.py

      - name: Verify generated resources and optimized assets
        if: steps.exports.outputs.available == 'true'
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/data/pokemon.json
          test -s dist/data/build-manifest.json
          test -s dist/data/build-diagnostics.json
          test -s dist/data/latest-export.csv
          test -s dist/llms.txt
          grep -Eq 'assets/app\.[0-9a-f]{12}\.js' dist/index.html
          grep -Eq 'assets/accessibility\.[0-9a-f]{12}\.js' dist/index.html
          grep -Eq 'data/filter-options\.[0-9a-f]{12}\.json' dist/data/build-manifest.json
          grep -q 'data-critical-css' dist/index.html
          ! grep -q 'populateDynamicOptions();' dist/assets/app.*.js
          grep -q 'collection-initialize' dist/assets/app.*.js

      - name: Run browser regression and accessibility tests
        if: steps.exports.outputs.available == 'true'
        run: npm run test:browser

      - name: Upload browser test report
        if: always() && steps.exports.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
