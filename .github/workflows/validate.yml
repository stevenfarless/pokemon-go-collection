name: Validate collection site

on:
  pull_request:
    paths:
      - "exports/shared-text-*.csv"
      - "exports/**/shared-text-*.csv"
      - "knowledge/**"
      - "external/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run dashboard JavaScript tests
        run: |
          node --check site/app.js
          node --check site/hardening.js
          node --check site/accessibility.js
          node --check site/dashboard.js
          node --check site/advanced-search.js
          node --check site/companion.js
          node --check site/planning.js
          node --check site/planning-extras.js
          node --check site/final-tools.js
          node --check site/local-data.js
          node --check site/insights.js
          node --check site/sw.js
          node --check scripts/production_smoke_browser.js
          node tests/test_multisort.js
          node tests/test_hardening.js
          node tests/test_accessible_sort.js
          node tests/test_summary_presets.js
          node tests/test_usability.js
          node tests/test_dashboard.js
          node tests/test_advanced_search.js
          node tests/test_companion.js
          node tests/test_planning.js
          node tests/test_planning_extras.js
          node tests/test_final_tools.js
          node tests/test_local_data.js
      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find exports -type f -name 'shared-text-*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived export is committed under exports/; generator behavior is covered by tests."
          fi
      - name: Build site
        if: steps.exports.outputs.available == 'true'
        run: python scripts/build_dashboard.py
      - name: Validate generated JSON contracts
        if: steps.exports.outputs.available == 'true'
        run: python scripts/validate_generated.py
      - name: Run production promotion guard against PR build
        if: steps.exports.outputs.available == 'true'
        run: python scripts/deployment_guard.py --output dist
      - name: Verify canonical resources and assets
        if: steps.exports.outputs.available == 'true'
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/insights.html
          test -s dist/tools.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/assets/app-icon.svg
          test -s dist/data/pokemon.json
          test -s dist/data/pokemon-index.json
          test -s dist/data/build-manifest.json
          test -s dist/data/build-diagnostics.json
          test -s dist/data/data-health.json
          test -s dist/data/data-health.schema.json
          test -s dist/data/insights.json
          test -s dist/data/insights.schema.json
          test -s dist/data/knowledge/pokemon-go.json
          test -s dist/data/knowledge/pokemon-go.schema.json
          test -s dist/data/knowledge/species-index.json
          test -s dist/data/knowledge/species-index.schema.json
          test -s dist/data/knowledge/PVPOKE-LICENSE.txt
          test -s dist/data/candidates/index.json
          test -s dist/data/investments/records.json
          test -s dist/data/external/index.json
          test -s dist/data/external/snapshots/events-pokemon-go-official-human-reviewed.json
          test -s dist/data/external/snapshots/raids-pokemon-go-official-human-reviewed.json
          test -s dist/data/latest-export.csv
          test -s dist/llms.txt
          grep -Eq 'assets/app\.[0-9a-f]{12}\.js' dist/index.html
          grep -Eq 'assets/accessibility\.[0-9a-f]{12}\.js' dist/index.html
          grep -Eq 'assets/dashboard\.[0-9a-f]{12}\.js' dist/index.html
          grep -Eq 'assets/advanced-search\.[0-9a-f]{12}\.js' dist/index.html
          grep -Eq 'assets/dashboard\.[0-9a-f]{12}\.css' dist/index.html
          grep -Eq 'assets/companion\.[0-9a-f]{12}\.js' dist/index.html
          grep -Eq 'assets/companion\.[0-9a-f]{12}\.css' dist/index.html
          grep -Eq 'assets/insights\.[0-9a-f]{12}\.js' dist/insights.html
          grep -Eq 'assets/planning\.[0-9a-f]{12}\.js' dist/tools.html
          grep -Eq 'assets/planning-extras\.[0-9a-f]{12}\.js' dist/tools.html
          grep -Eq 'assets/final-tools\.[0-9a-f]{12}\.js' dist/tools.html
          grep -Eq 'assets/local-data\.[0-9a-f]{12}\.js' dist/tools.html
          grep -Eq 'assets/planning\.[0-9a-f]{12}\.css' dist/tools.html
          grep -Eq 'href="tools\.html"[^>]*>Tools</a>' dist/index.html
          grep -Eq 'href="tools\.html"[^>]*>Tools</a>' dist/insights.html
          grep -q 'rel="manifest" href="manifest.webmanifest"' dist/index.html
          grep -q 'rel="manifest" href="manifest.webmanifest"' dist/tools.html
          grep -q 'pokemon-go-collection-' dist/sw.js
          grep -q 'tools.html' dist/sw.js
          grep -q 'local-data' dist/sw.js
          grep -q 'site/companion.js' dist/data/build-manifest.json
          grep -q 'site/advanced-search.js' dist/data/build-manifest.json
          grep -q 'site/planning.js' dist/data/build-manifest.json
          grep -q 'site/planning-extras.js' dist/data/build-manifest.json
          grep -q 'site/final-tools.js' dist/data/build-manifest.json
          grep -q 'site/local-data.js' dist/data/build-manifest.json
          grep -q 'site/tools.html' dist/data/build-manifest.json
          grep -q '"service_worker": "sw.js"' dist/data/build-manifest.json
          grep -Eq 'data/filter-options\.[0-9a-f]{12}\.json' dist/data/build-manifest.json
          grep -q 'data/knowledge/pokemon-go.json' dist/data/build-manifest.json
          grep -q 'data/knowledge/species-index.json' dist/data/build-manifest.json
          grep -q 'data/external/snapshots/events-pokemon-go-official-human-reviewed.json' dist/data/build-manifest.json
          grep -q 'data/external/snapshots/raids-pokemon-go-official-human-reviewed.json' dist/data/build-manifest.json
          grep -q 'data-critical-css' dist/index.html
          grep -q 'data-summary-preset="hundos"' dist/index.html
          grep -q 'CollectionDashboard' dist/assets/dashboard.*.js
          grep -q 'CollectionAdvancedSearch' dist/assets/advanced-search.*.js
          grep -q 'CollectionCompanion' dist/assets/companion.*.js
          grep -q 'CollectionPlanning' dist/assets/planning.*.js
          grep -q 'CollectionPlanningExtras' dist/assets/planning-extras.*.js
          grep -q 'CollectionFinalTools' dist/assets/final-tools.*.js
          grep -q 'CollectionLocalData' dist/assets/local-data.*.js
          grep -q 'id="duplicate-review"' dist/tools.html
          grep -q 'id="annotations"' dist/tools.html
          grep -q 'id="enrichment"' dist/tools.html
          grep -q 'id="local-data-backup"' dist/tools.html
          grep -q 'id="event-planner"' dist/tools.html
          grep -q 'name:pikachu' dist/index.html
          grep -q 'data-column-toggle="moves"' dist/index.html
          ! grep -q 'data-summary-presets' dist/index.html
          ! grep -q 'data-usability' dist/index.html
          ! grep -q 'populateDynamicOptions();' dist/assets/app.*.js
          grep -q 'collection-initialize' dist/assets/app.*.js
          grep -q 'scripts/build_dashboard.py' dist/data/build-manifest.json
      - name: Run browser regression and accessibility tests
        if: steps.exports.outputs.available == 'true'
        run: npm run test:browser
      - name: Build pre-optimization performance baseline
        if: steps.exports.outputs.available == 'true'
        shell: bash
        run: |
          git worktree add --detach /tmp/pokemon-go-performance-baseline 021fcded408c0d0c91c63039dd2de988f87188e3
          python /tmp/pokemon-go-performance-baseline/scripts/build_collection.py --root /tmp/pokemon-go-performance-baseline --output /tmp/pokemon-go-performance-baseline/dist
      - name: Run Lighthouse mobile before-and-after audit
        if: steps.exports.outputs.available == 'true'
        env:
          BASELINE_DIST: /tmp/pokemon-go-performance-baseline/dist
          CURRENT_DIST: dist
        run: npm run test:performance
      - name: Upload validation reports
        if: always() && steps.exports.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reports
          path: |
            playwright-report/
            test-results/
            performance-results/
          if-no-files-found: ignore
          retention-days: 14
