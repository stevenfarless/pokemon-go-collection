name: Validate collection site

on:
  pull_request:
    paths:
      - "**/shared-text-*.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find . -type f -name 'shared-text-*.csv' -not -path './.git/*' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived export is committed yet; generator behavior is covered by tests."
          fi

      - name: Build site
        if: steps.exports.outputs.available == 'true'
        run: python scripts/build_site.py

      - name: Verify generated resources
        if: steps.exports.outputs.available == 'true'
        run: |
          test -s dist/index.html
          test -s dist/data/pokemon.json
          test -s dist/data/build-manifest.json
          test -s dist/data/latest-export.csv
          test -s dist/llms.txt
