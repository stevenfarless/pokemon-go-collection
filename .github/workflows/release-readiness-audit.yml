name: Release readiness audit

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: Audit the full release gate or only selected gates
        required: true
        default: full
        type: choice
        options:
          - full
          - targeted
      target_gates:
        description: Comma-separated gate IDs for targeted audits
        required: false
        type: string
      audit_reason:
        description: Reason for a targeted audit
        required: false
        type: string
  schedule:
    - cron: "17 8 1 1,4,7,10 *"

permissions:
  contents: read

concurrency:
  group: release-readiness-audit
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify report contract
        run: python -m unittest discover -s tests -p 'test_release_readiness.py' -v
      - name: Stamp current review metadata and audit scope
        env:
          REVIEW_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          AUDIT_MODE: ${{ inputs.audit_mode || 'full' }}
          TARGET_GATES: ${{ inputs.target_gates || '' }}
          AUDIT_REASON: ${{ inputs.audit_reason || '' }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          source = Path("config/release-readiness-evidence.json")
          target = Path("release-readiness-evidence.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          data["commit_sha"] = os.environ["REVIEW_SHA"]
          data["reviewed_at"] = datetime.datetime.now(datetime.UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          mode = os.environ["AUDIT_MODE"] if os.environ["EVENT_NAME"] == "workflow_dispatch" else "full"
          if mode == "targeted":
              gates = [item.strip() for item in os.environ["TARGET_GATES"].split(",") if item.strip()]
              data["audit_scope"] = {
                  "mode": "targeted",
                  "gates": gates,
                  "reason": os.environ["AUDIT_REASON"].strip(),
              }
          else:
              data["audit_scope"] = {"mode": "full", "gates": [], "reason": ""}

          target.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Build release-readiness report
        run: python scripts/build_release_readiness.py --evidence release-readiness-evidence.json --output-dir release-readiness-report
      - name: Upload release-readiness report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-report
          path: release-readiness-report/
          retention-days: 30
