name: One-run resilience app fix

on:
  push:
    branches:
      - quality/resilience-critical-157-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: quality/resilience-critical-157-clean
      - name: Normalize collection load failure message
        shell: python
        run: |
          from pathlib import Path
          path = Path('site/app.js')
          source = path.read_text(encoding='utf-8')
          old = '    elements.resultCount.textContent = error instanceof Error ? error.message : "Collection data could not be loaded";\n'
          new = '    elements.resultCount.textContent = "Collection data could not be loaded";\n'
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8', newline='\n')
          elif new not in source:
              raise SystemExit('Expected collection load failure handler was not found')
      - name: Commit fix when needed
        run: |
          if git diff --quiet -- site/app.js; then
            echo "Fail-closed message already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js
          git commit -m "Normalize malformed collection load failure state"
          git push origin HEAD:quality/resilience-critical-157-clean
