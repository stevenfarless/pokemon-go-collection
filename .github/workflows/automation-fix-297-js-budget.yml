name: Temporary JS budget repair
on:
  push:
    branches:
      - automation/issue-159-bounded-release-browser-audit
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/issue-159-bounded-release-browser-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Recover JavaScript budget headroom
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site/planning.js'); s=p.read_text(); old='Current-game freshness:'; new='Game freshness:'
          if old not in s: raise SystemExit('status wording not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Check JavaScript
        run: |
          npm ci --no-audit --no-fund
          npm run lint:js
          npm run test:unit:js
      - name: Commit tested repair
        run: |
          rm .github/workflows/automation-fix-297-js-budget.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/planning.js .github/workflows/automation-fix-297-js-budget.yml
          git commit -m 'Keep planner readiness inside JS budget'
          git push origin HEAD:automation/issue-159-bounded-release-browser-audit
