name: Temporary planner readiness repair

on:
  push:
    branches:
      - automation/issue-159-bounded-release-browser-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/issue-159-bounded-release-browser-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Yield after planner readiness
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('site/planning.js')
          text = path.read_text()
          old = '''      if (status) status.textContent = `Loaded ${resources.records.length.toLocaleString()} canonical owned records. Current-game freshness: ${resources.external?.overall_freshness || "unavailable"}.`;
      installTeamUi(root, resources);
      installOptimizerUi(root, resources);
      installGoalsUi(root, resources);
      installTradeUi(root, resources);
      if ("serviceWorker" in root.navigator) root.navigator.serviceWorker.register("sw.js").catch(() => {});'''
          new = '''      if (status) status.textContent = `Loaded ${resources.records.length.toLocaleString()} canonical owned records. Current-game freshness: ${resources.external?.overall_freshness || "unavailable"}.`;
      await new Promise(r=>setTimeout(r));
      installTeamUi(root, resources); installOptimizerUi(root, resources); installGoalsUi(root, resources); installTradeUi(root, resources);
      if("serviceWorker"in root.navigator) root.navigator.serviceWorker.register("sw.js").catch(() => {});'''
          if old not in text:
              raise SystemExit('planner install block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Extend focused regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_tools_startup_sequence.js')
          text = path.read_text()
          needle = '''assert.match(
            planning,
            /root\\.__collectionPlanningReady = api\\.install\\(root\\)/,
            "planning bootstrap must expose its initialization promise",
          );'''
          addition = needle + '''
          const readyIndex = planning.indexOf("status.textContent = `Loaded");
          const yieldIndex = planning.indexOf("await new Promise(r=>setTimeout(r));");
          const teamIndex = planning.indexOf("installTeamUi(root, resources)");
          assert.ok(readyIndex >= 0 && yieldIndex > readyIndex && teamIndex > yieldIndex, "planning must yield after reporting readiness and before secondary UI setup");'''
          if needle not in text:
              raise SystemExit('startup assertion block not found')
          path.write_text(text.replace(needle, addition, 1))
          PY
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Run focused JavaScript checks
        run: |
          npm run lint:js
          npm run test:unit:js
      - name: Commit tested repair
        run: |
          rm .github/workflows/automation-fix-297-planner-yield.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/planning.js tests/test_tools_startup_sequence.js .github/workflows/automation-fix-297-planner-yield.yml
          git commit -m 'Yield after Tools planner is ready'
          git push origin HEAD:automation/issue-159-bounded-release-browser-audit
