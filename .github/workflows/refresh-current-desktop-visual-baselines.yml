name: Refresh current desktop visual baselines

on:
  push:
    branches:
      - fix/main-visual-suite-timeout

permissions:
  contents: write

concurrency:
  group: refresh-current-desktop-visual-baselines
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh reviewed visual baselines from CI'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build current site
        run: python scripts/build_dashboard.py
      - name: Capture reviewed visual baselines
        shell: bash
        run: |
          npx playwright test tests/browser/visual-regression.spec.js --project=desktop-chromium --update-snapshots
          npx playwright test tests/browser/visual-regression.spec.js --project=mobile-chromium --grep 'mobile record detail visual state' --update-snapshots
          python - <<'PY'
          import base64
          from pathlib import Path

          desktop = (
              'collection-phone', 'collection-tablet', 'collection-desktop', 'collection-empty',
              'collection-density-edge-cases', 'collection-offline', 'collection-error',
              'insights-at-a-glance', 'tools-backup-preview',
          )
          snapshots = Path('tests/browser/visual-regression.spec.js-snapshots')
          baselines = Path('tests/visual-baselines')
          for name in desktop:
              source = snapshots / f'{name}-desktop-chromium-linux.png'
              raw = source.read_bytes()
              assert raw.startswith(b'\x89PNG\r\n\x1a\n'), name
              (baselines / f'{name}.png.b64').write_text(base64.b64encode(raw).decode() + '\n')
          source = snapshots / 'record-detail-phone-mobile-chromium-linux.png'
          raw = source.read_bytes()
          assert raw.startswith(b'\x89PNG\r\n\x1a\n'), 'record-detail-phone'
          (baselines / 'record-detail-phone.png.b64').write_text(base64.b64encode(raw).decode() + '\n')
          PY
      - name: Commit reviewed current renders
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual-baselines/*.png.b64
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh reviewed visual baselines from CI'
          git push
