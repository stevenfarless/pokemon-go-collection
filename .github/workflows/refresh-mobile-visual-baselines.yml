name: Refresh current mobile visual baselines

on:
  push:
    branches:
      - fix/current-mobile-visual-baselines

permissions:
  contents: write

concurrency:
  group: refresh-mobile-visual-baselines
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.head_commit.message != 'Refresh current mobile visual baselines from CI'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build current site
        run: python scripts/build_dashboard.py
      - name: Capture current mobile baselines
        shell: bash
        run: |
          set +e
          npx playwright test tests/browser/visual-regression.spec.js --project=desktop-chromium --project=mobile-chromium
          status=$?
          set -e
          phone=$(find test-results -name 'collection-phone-actual.png' -print -quit)
          detail=$(find test-results -name 'record-detail-phone-actual.png' -print -quit)
          test -n "$phone"
          test -n "$detail"
          base64 -w 0 "$phone" > tests/visual-baselines/collection-phone.png.b64
          printf '\n' >> tests/visual-baselines/collection-phone.png.b64
          base64 -w 0 "$detail" > tests/visual-baselines/record-detail-phone.png.b64
          printf '\n' >> tests/visual-baselines/record-detail-phone.png.b64
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ('collection-phone.png.b64', 'record-detail-phone.png.b64'):
              raw = base64.b64decode(Path('tests/visual-baselines', name).read_text().strip(), validate=True)
              assert raw.startswith(b'\x89PNG\r\n\x1a\n'), name
              assert len(raw) > 50000, (name, len(raw))
          PY
          echo "Initial visual comparison exit status: $status"
      - name: Commit reviewed current renders
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual-baselines/collection-phone.png.b64 tests/visual-baselines/record-detail-phone.png.b64
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh current mobile visual baselines from CI'
          git push
