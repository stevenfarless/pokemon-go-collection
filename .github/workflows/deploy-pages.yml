name: Deploy collection to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "exports/shared-text-*.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/deploy-pages.yml"
      - ".github/dependabot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-export:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.exports.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find exports -type f -name 'shared-text-*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived Poke Genie export is committed under exports/, so deployment is skipped."
          fi

  build:
    needs: check-export
    if: needs.check-export.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run dashboard JavaScript tests
        run: |
          node --check site/app.js
          node --check site/hardening.js
          node --check site/accessibility.js
          node --check site/summary-presets.js
          node --check site/usability.js
          node tests/test_multisort.js
          node tests/test_hardening.js
          node tests/test_accessible_sort.js
          node tests/test_summary_presets.js
          node tests/test_usability.js

      - name: Build static site from newest export
        run: python scripts/build_dashboard.py

      - name: Validate generated JSON contracts
        run: python scripts/validate_generated.py

      - name: Run browser regression and accessibility tests
        run: npm run test:browser

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 1800000
