name: Deploy collection to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "exports/shared-text-*.csv"
      - "exports/**/shared-text-*.csv"
      - "knowledge/**"
      - "external/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/rollback-pages.yml"
      - ".github/workflows/bootstrap-self-test.yml"
      - ".github/workflows/sync-knowledge.yml"
      - ".github/dependabot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-export:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.exports.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find exports -type f -name 'shared-text-*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived Poke Genie export is committed under exports/, so deployment is skipped."
          fi

  build:
    needs: check-export
    if: needs.check-export.outputs.available == 'true'
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.promote.outputs.build_id }}
      source_file: ${{ steps.promote.outputs.source_file }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run fork/bootstrap self-test
        run: python scripts/bootstrap_self_test.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run dashboard JavaScript tests
        run: |
          node --check site/app.js
          node --check site/hardening.js
          node --check site/accessibility.js
          node --check site/dashboard.js
          node --check site/advanced-search.js
          node --check site/companion.js
          node --check site/planning.js
          node --check site/planning-extras.js
          node --check site/final-tools.js
          node --check site/local-data.js
          node --check site/insights.js
          node --check site/sw.js
          node --check scripts/production_smoke_browser.js
          node tests/test_multisort.js
          node tests/test_hardening.js
          node tests/test_accessible_sort.js
          node tests/test_summary_presets.js
          node tests/test_usability.js
          node tests/test_dashboard.js
          node tests/test_advanced_search.js
          node tests/test_companion.js
          node tests/test_planning.js
          node tests/test_planning-extras.js
          node tests/test_final_tools.js
          node tests/test_local_data.js

      - name: Build isolated staging site
        run: |
          rm -rf staging
          python scripts/build_dashboard.py --output staging

      - name: Validate staged JSON contracts
        run: python scripts/validate_generated.py --output staging

      - name: Verify companion and machine-readable resources
        run: |
          test -s staging/insights.html
          test -s staging/tools.html
          test -s staging/manifest.webmanifest
          test -s staging/sw.js
          test -s staging/assets/app-icon.svg
          test -s staging/data/data-health.json
          test -s staging/data/insights.json
          test -s staging/data/llm-bootstrap.json
          test -s staging/data/pokemon-index.json
          test -s staging/data/pokemon.json
          test -s staging/data/build-manifest.json
          test -s staging/data/collection-summary.json
          test -s staging/data/latest-export.csv
          test -s staging/data/knowledge/pokemon-go.json
          test -s staging/data/knowledge/pokemon-go.schema.json
          test -s staging/data/knowledge/species-index.json
          test -s staging/data/knowledge/species-index.schema.json
          test -s staging/data/knowledge/PVPOKE-LICENSE.txt
          test -s staging/data/candidates/index.json
          test -s staging/data/investments/records.json
          test -s staging/data/external/index.json
          test -s staging/data/external/snapshots/events-pokemon-go-official-human-reviewed.json
          test -s staging/data/external/snapshots/raids-pokemon-go-official-human-reviewed.json
          grep -Eq 'assets/dashboard\.[0-9a-f]{12}\.js' staging/index.html
          grep -Eq 'assets/advanced-search\.[0-9a-f]{12}\.js' staging/index.html
          grep -Eq 'assets/companion\.[0-9a-f]{12}\.js' staging/index.html
          grep -Eq 'assets/companion\.[0-9a-f]{12}\.css' staging/index.html
          grep -Eq 'assets/insights\.[0-9a-f]{12}\.js' staging/insights.html
          grep -Eq 'assets/planning\.[0-9a-f]{12}\.js' staging/tools.html
          grep -Eq 'assets/planning-extras\.[0-9a-f]{12}\.js' staging/tools.html
          grep -Eq 'assets/final-tools\.[0-9a-f]{12}\.js' staging/tools.html
          grep -Eq 'assets/local-data\.[0-9a-f]{12}\.js' staging/tools.html
          grep -Eq 'assets/planning\.[0-9a-f]{12}\.css' staging/tools.html
          grep -Eq 'href="tools\.html"[^>]*>Tools</a>' staging/index.html
          grep -q 'rel="manifest" href="manifest.webmanifest"' staging/index.html
          grep -q 'rel="manifest" href="manifest.webmanifest"' staging/tools.html
          grep -q 'tools.html' staging/sw.js
          grep -q 'local-data' staging/sw.js
          grep -q '"service_worker": "sw.js"' staging/data/build-manifest.json
          grep -q 'site/advanced-search.js' staging/data/build-manifest.json
          grep -q 'site/planning.js' staging/data/build-manifest.json
          grep -q 'site/planning-extras.js' staging/data/build-manifest.json
          grep -q 'site/final-tools.js' staging/data/build-manifest.json
          grep -q 'site/local-data.js' staging/data/build-manifest.json
          grep -q 'site/tools.html' staging/data/build-manifest.json
          grep -q 'data/knowledge/pokemon-go.json' staging/data/build-manifest.json
          grep -q 'data/knowledge/species-index.json' staging/data/build-manifest.json
          grep -q 'data/external/snapshots/events-pokemon-go-official-human-reviewed.json' staging/data/build-manifest.json
          grep -q 'data/external/snapshots/raids-pokemon-go-official-human-reviewed.json' staging/data/build-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("staging/data")
          bootstrap = json.loads((root / "llm-bootstrap.json").read_text())
          manifest = json.loads((root / "build-manifest.json").read_text())
          index = json.loads((root / "pokemon-index.json").read_text())
          pokemon = json.loads((root / "pokemon.json").read_text())
          external = json.loads((root / "external/index.json").read_text())
          build_ids = {bootstrap["build_id"], manifest["build_id"], index["build_id"], pokemon["manifest"]["build_id"], external["build_id"]}
          if len(build_ids) != 1:
              raise SystemExit(f"Machine endpoints disagree on build_id: {build_ids}")
          if bootstrap["normalized_record_count"] != manifest["normalized_record_count"] or bootstrap["normalized_record_count"] != index["normalized_record_count"]:
              raise SystemExit("Machine endpoints disagree on normalized record count")
          if bootstrap["normalized_record_count"] != len(pokemon["records"]):
              raise SystemExit("pokemon.json record count disagrees with LLM bootstrap")
          if not index["shards"]:
              raise SystemExit("Shard index is empty")
          if {item["data_category"] for item in external["snapshots"]} != {"events", "raids"}:
              raise SystemExit("Production external index must publish event and raid snapshots")
          for shard in index["shards"]:
              path = Path("staging") / shard["path"]
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing shard: {shard['path']}")
          PY

      - name: Run promotion guard
        id: promote
        shell: bash
        run: |
          python scripts/deployment_guard.py --output staging
          BUILD_ID="$(python -c 'import json; print(json.load(open("staging/data/build-manifest.json"))["build_id"])')"
          SOURCE_FILE="$(python -c 'import json; print(json.load(open("staging/data/build-manifest.json"))["source_file"])')"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "source_file=$SOURCE_FILE" >> "$GITHUB_OUTPUT"
          {
            echo "### Pages promotion candidate"
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Source export: \`$SOURCE_FILE\`"
            echo "- Promotion status: validated"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run browser regression and accessibility tests against staging
        env:
          COLLECTION_DIST: staging
        run: npm run test:browser

      - name: Retain rollback artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-lkg-${{ steps.promote.outputs.build_id }}
          path: staging
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: staging
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Capture current production build before promotion
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          request = urllib.request.Request(f"https://api.github.com/repos/{repository}/pages", headers=headers)
          page_url = ""
          previous = ""
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  page_url = json.load(response).get("html_url", "")
              if page_url:
                  with urllib.request.urlopen(page_url.rstrip("/") + "/data/build-manifest.json?predeploy=1", timeout=20) as response:
                      previous = str(json.load(response).get("build_id", ""))
          except Exception as exc:
              print(f"Pre-deploy live build lookup unavailable: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"page_url={page_url}", file=out)
              print(f"build_id={previous}", file=out)
          print(f"Current live build before promotion: {previous or 'unknown'}")
          PY

      - name: Deploy validated build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed machine resources
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: python scripts/production_smoke.py --base-url "$PAGE_URL" --expected-build-id "$EXPECTED_BUILD_ID"

      - name: Set up Node.js for deployed browser smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install browser smoke dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify deployed browser behavior
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: node scripts/production_smoke_browser.js

      - name: Record rollback target when production smoke fails
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PREVIOUS_BUILD_ID: ${{ steps.previous.outputs.build_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          previous = os.environ.get("PREVIOUS_BUILD_ID", "")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          artifact = None
          if previous:
              name = urllib.parse.quote(f"pages-lkg-{previous}")
              request = urllib.request.Request(f"https://api.github.com/repos/{repository}/actions/artifacts?name={name}&per_page=100", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      items = json.load(response).get("artifacts", [])
                  items = [item for item in items if not item.get("expired")]
                  if items:
                      artifact = max(items, key=lambda item: item.get("created_at", ""))
              except Exception as exc:
                  print(f"Could not resolve retained rollback artifact: {exc}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              print("### Production smoke failure", file=out)
              print(f"- Failed candidate build: `{os.environ.get('EXPECTED_BUILD_ID', 'see build job')}`", file=out)
              print(f"- Previously deployed build: `{previous or 'unknown'}`", file=out)
              if artifact:
                  run_id = (artifact.get("workflow_run") or {}).get("id")
                  print(f"- Retained rollback artifact: `{artifact['name']}` (artifact `{artifact['id']}`, workflow run `{run_id}`)", file=out)
                  print("- Use the repository rollback workflow with that retained last-known-good artifact; do not rewrite collection history.", file=out)
              else:
                  print("- No unexpired prior rollback artifact could be resolved automatically. Inspect the preceding successful Pages workflow before rollback.", file=out)
          PY

      - name: Record successful promotion
        run: |
          {
            echo "### Pages promotion complete"
            echo "- Build ID: \`${{ needs.build.outputs.build_id }}\`"
            echo "- Source export: \`${{ needs.build.outputs.source_file }}\`"
            echo "- Machine endpoints: verified on the public Pages site"
            echo "- Browser exact/zero-result search and Tools loading: verified on the public Pages site"
            echo "- Pre-deploy build: \`${{ steps.previous.outputs.build_id || 'unknown' }}\`"
            echo "- Rollback artifact retained for 14 days in the originating workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
