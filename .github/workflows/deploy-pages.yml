name: Deploy collection to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**/shared-text-*.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-export:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.exports.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find . -type f -name 'shared-text-*.csv' -not -path './.git/*' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived Poke Genie export is committed, so deployment is skipped."
          fi

  build:
    needs: check-export
    if: needs.check-export.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build static site from newest export
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
