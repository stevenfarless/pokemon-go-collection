name: Deploy collection to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "exports/shared-text-*.csv"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/deploy-pages.yml"
      - ".github/dependabot.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-export:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.exports.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect archived exports
        id: exports
        shell: bash
        run: |
          if find exports -type f -name 'shared-text-*.csv' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No archived Poke Genie export is committed under exports/, so deployment is skipped."
          fi

  build:
    needs: check-export
    if: needs.check-export.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run dashboard JavaScript tests
        run: |
          node --check site/app.js
          node --check site/hardening.js
          node --check site/accessibility.js
          node tests/test_multisort.js
          node tests/test_hardening.js
          node tests/test_accessible_sort.js

      - name: Build static site from newest export
        run: python scripts/build_collection.py

      - name: Validate generated JSON contracts
        run: python scripts/validate_generated.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
