name: Re-evaluate external data freshness

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-validated-pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the normal validated Pages workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/actions/workflows/deploy-pages.yml/dispatches"
          body = json.dumps({"ref": "main"}).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"workflow dispatch returned HTTP {response.status}")
          print("Dispatched the standard Pages build so external snapshot freshness/validity is recalculated from unchanged reviewed source metadata.")
          PY
