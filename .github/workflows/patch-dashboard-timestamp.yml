name: Patch dashboard timestamp formatting

on:
  push:
    branches:
      - agent/next-five-static-features
    paths:
      - .github/workflows/patch-dashboard-timestamp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/next-five-static-features

      - name: Patch canonical source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("site/dashboard.js")
          source = path.read_text(encoding="utf-8")
          old = '{ dateStyle: "medium", timeStyle: "short", timeZoneName: "short" }'
          new = '{ dateStyle: "medium", timeStyle: "short" }'
          if old not in source:
              raise SystemExit("Expected timestamp formatter was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Commit canonical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dashboard.js
          git commit -m "Fix canonical Data Health timestamp formatting"
          git push origin HEAD:agent/next-five-static-features
