name: Apply PR 190 runtime patch

on:
  push:
    branches:
      - fix/playwright-config-regression

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/playwright-config-regression
          fetch-depth: 0
      - name: Apply focused runtime patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/pr190-runtime.patch
          if [[ ! -f "$patch" ]]; then
            echo "Patch already consumed."
            exit 0
          fi
          git apply --check "$patch"
          git apply "$patch"
          git rm "$patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/action-workflows.js site/platform.css
          git commit -m "Fix lazy decisions and mobile utility stacking"
          git push origin HEAD:fix/playwright-config-regression
