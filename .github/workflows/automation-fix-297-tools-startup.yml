name: Temporary fix for PR 297 Tools startup

on:
  push:
    branches:
      - automation/issue-159-bounded-release-browser-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/issue-159-bounded-release-browser-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Sequence heavy Tools startup
        run: |
          python - <<'PY'
          from pathlib import Path

          planning = Path('site/planning.js')
          text = planning.read_text()
          old = '''  if (root?.document) {
              if (root.document.readyState === "loading") root.document.addEventListener("DOMContentLoaded", () => api.install(root), { once: true });
              else api.install(root);
            }'''.replace('            ', '')
          new = '''  if (root?.document) {
              const install = () => { root.__collectionPlanningReady = api.install(root); };
              if (root.document.readyState === "loading") root.document.addEventListener("DOMContentLoaded", install, { once: true });
              else install();
            }'''.replace('            ', '')
          if old not in text:
              raise SystemExit('planning startup block not found')
          planning.write_text(text.replace(old, new, 1))

          for filename in ('site/final-tools.js', 'site/local-data.js'):
              path = Path(filename)
              text = path.read_text()
              old = '''  if (root?.document) {
                  if (root.document.readyState === "loading") root.document.addEventListener("DOMContentLoaded", () => api.install(root), { once: true });
                  else api.install(root);
                }'''.replace('                ', '')
              new = '''  if (root?.document) {
                  const install = () => Promise.resolve(root.__collectionPlanningReady).then(() => api.install(root));
                  if (root.document.readyState === "loading") root.document.addEventListener("DOMContentLoaded", install, { once: true });
                  else install();
                }'''.replace('                ', '')
              if old not in text:
                  raise SystemExit(f'{filename} startup block not found')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Run focused JavaScript checks
        run: |
          npm run lint:js
          npm run test:unit:js
      - name: Commit tested repair
        run: |
          rm .github/workflows/automation-fix-297-tools-startup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/planning.js site/final-tools.js site/local-data.js .github/workflows/automation-fix-297-tools-startup.yml
          git commit -m 'Sequence heavy Tools startup work'
          git push origin HEAD:automation/issue-159-bounded-release-browser-audit
