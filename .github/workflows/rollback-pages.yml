name: Roll back GitHub Pages

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Deploy collection workflow run ID that retained the build"
        required: true
        type: string
      build_id:
        description: "Expected 12-character build ID from that deployment"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Download retained last-known-good build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-lkg-${{ inputs.build_id }}
          path: rollback
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Revalidate rollback candidate
        run: |
          python scripts/deployment_guard.py \
            --output rollback \
            --expected-build-id "${{ inputs.build_id }}"
          {
            echo "### Rollback candidate validated"
            echo "- Source workflow run: \`${{ inputs.run_id }}\`"
            echo "- Build ID: \`${{ inputs.build_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload rollback candidate as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: rollback
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - name: Deploy retained build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Record rollback
        run: |
          {
            echo "### Rollback deployment complete"
            echo "- Restored build ID: \`${{ inputs.build_id }}\`"
            echo "- Retained artifact source run: \`${{ inputs.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
