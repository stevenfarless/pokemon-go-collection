name: Fork bootstrap self-test

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install contract dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --no-audit --no-fund

      - name: Check repository bootstrap prerequisites
        run: python scripts/bootstrap_self_test.py

      - name: Check GitHub Pages is configured for Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          HTTP_STATUS="$(curl --silent --show-error \
            --output /tmp/pages.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GH_REPOSITORY/pages")"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GitHub Pages is not enabled for this repository. In Settings > Pages, set Build and deployment > Source to GitHub Actions, then rerun this workflow."
            cat /tmp/pages.json || true
            exit 1
          fi
          BUILD_TYPE="$(python -c 'import json; print(json.load(open("/tmp/pages.json")).get("build_type", ""))')"
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "::error::GitHub Pages is enabled but is not using GitHub Actions. In Settings > Pages, set Build and deployment > Source to GitHub Actions."
            exit 1
          fi
          echo "GitHub Pages configuration is ready: build_type=workflow"

      - name: Build clean self-test artifact
        run: |
          rm -rf bootstrap-staging
          python scripts/build_dashboard.py --output bootstrap-staging

      - name: Validate self-test artifact
        run: |
          python scripts/validate_generated.py --output bootstrap-staging
          python scripts/deployment_guard.py --output bootstrap-staging

      - name: Report ready state
        run: |
          BUILD_ID="$(python -c 'import json; print(json.load(open("bootstrap-staging/data/build-manifest.json"))["build_id"])')"
          SOURCE_FILE="$(python -c 'import json; print(json.load(open("bootstrap-staging/data/build-manifest.json"))["source_file"])')"
          {
            echo "### Fork bootstrap self-test passed"
            echo "- Pages source: GitHub Actions"
            echo "- Build ID: \`$BUILD_ID\`"
            echo "- Source export: \`$SOURCE_FILE\`"
            echo "- No paid backend or repository secret is required."
          } >> "$GITHUB_STEP_SUMMARY"
